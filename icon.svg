<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Rounded Squircle -->
  <rect width="512" height="512" rx="112" fill="#090d16"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="#0f172a" stroke="#f97316" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Inner Glow Grid Background -->
  <g opacity="0.1" stroke="#ffffff" stroke-width="1.5">
    <line x1="64" y1="128" x2="448" y2="128"/>
    <line x1="64" y1="256" x2="448" y2="256"/>
    <line x1="64" y1="384" x2="448" y2="384"/>
    <line x1="128" y1="64" x2="128" y2="448"/>
    <line x1="256" y1="64" x2="256" y2="448"/>
    <line x1="384" y1="64" x2="384" y2="448"/>
  </g>

  <!-- Central Badge / Sewing & Cutting Motif -->
  <g filter="url(#shadow)">
    <!-- Central Shield / Circle -->
    <circle cx="256" cy="220" r="130" fill="#1e293b" stroke="url(#iconGrad)" stroke-width="8"/>
    
    <!-- Stylized Cutting Scissors & Garment Layer Icons -->
    <path d="M190 170 C170 170 155 185 155 205 C155 225 170 240 190 240 C202 240 213 234 220 225 L292 297 C283 304 277 315 277 327 C277 347 292 362 312 362 C332 362 347 347 347 327 C347 307 332 292 312 292 C300 292 289 298 282 307 L210 235 C219 228 225 217 225 205 C225 185 210 170 190 170 Z" fill="none" stroke="url(#iconGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    
    <path d="M220 235 L347 160" stroke="#f97316" stroke-width="14" stroke-linecap="round"/>
    <path d="M210 225 L155 327" stroke="#eab308" stroke-width="14" stroke-linecap="round"/>
  </g>

  <!-- Title Text -->
  <text x="256" y="395" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="3">
    TASS <tspan fill="#f97316">INPUT</tspan>
  </text>
  <text x="256" y="440" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#eab308" letter-spacing="6">
    VER 2.0 • PRO
  </text>
</svg>
